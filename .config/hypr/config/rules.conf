# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr4"
    match:namespace = qsdock
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

# Floating AI overlay: NO blur.
# The layer surface is fixed at screen.height-60 (3440×1380 ≈ 4.7 Mpx). With blur
# enabled, Hyprland recomputes a 2-pass size-8 gaussian over that whole region every
# frame the surface is dirty. On the resize-handle RELEASE at max size, that final
# large repaint makes the amdgpu atomic commit miss the 144 Hz page-flip deadline
# (VRR off = hard miss → "Cannot commit when a page-flip is awaiting"), and Hyprland
# re-drives the output, blanking ALL windows for ~1 s. The panel background is 95%
# opaque, so blur behind it is barely visible — turning it off costs almost nothing
# visually and removes the per-frame full-surface blur entirely.
layerrule {
    name = "lr_floating_noblur"
    match:namespace = ^(qs-floating-overlay)$
    blur = off
}

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

# ───────── MASTER QUICKSHELL CONTAINER ─────────
windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}
