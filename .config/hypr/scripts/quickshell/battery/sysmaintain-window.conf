# Hyprland window rules: dock the system-maintenance kitty terminal over the
# battery popup's update panel, so it looks embedded inside the popup.
#
# Add to your hyprland.conf:
#     source = ~/.config/hypr/scripts/quickshell/battery/sysmaintain-window.conf
# then reload Hyprland (hyprctl reload).
#
# The battery popup is 801x760, anchored top-right (x = monitor_width - 805, y = 60).
# We inset the terminal slightly so it sits inside the panel's freed space rather
# than covering the whole popup. Adjust the move/size numbers to taste.

# Float it (don't tile into a workspace).
windowrulev2 = float, class:^(qs-sysmaintain)$
# No rounding fight / keep it crisp.
windowrulev2 = rounding 12, class:^(qs-sysmaintain)$
# Size: a bit smaller than the popup so it reads as an inner panel.
windowrulev2 = size 720 600, class:^(qs-sysmaintain)$
# Position: top-right, tucked just inside where the popup sits.
# 100% - 760 from the left edge, 110px down (under the popup header / update bar).
windowrulev2 = move 100%-760 110, class:^(qs-sysmaintain)$
# Keep it above the popup so it's visible in the freed space.
windowrulev2 = pin, class:^(qs-sysmaintain)$
# (kitty receives focus on open by default, so you can type your sudo password.)
# No border distraction.
windowrulev2 = noborder, class:^(qs-sysmaintain)$
