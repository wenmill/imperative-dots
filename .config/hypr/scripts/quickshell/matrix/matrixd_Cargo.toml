[package]
name = "matrixd"
version = "0.1.0"
edition = "2021"
description = "Headless matrix-rust-sdk daemon backing the imperative-dots Matrix popup (modern vodozemac E2EE)."

[dependencies]
matrix-sdk = { version = "0.17", features = ["e2e-encryption", "sqlite", "automatic-room-key-forwarding"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
